name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Includes the widget size budget check.
      - run: pnpm build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-output
          path: apps/web/.output
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: E2E (Playwright)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-output
          path: apps/web/.output
      - run: pnpm --filter @staticdesk/web exec playwright install --with-deps chromium
      - run: pnpm --filter @staticdesk/web test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  database:
    name: Database (migrations + RLS tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Starts only Postgres and applies every migration.
      - run: pnpm exec supabase db start
      - run: pnpm db:test
      - name: Check generated database types are up to date
        run: |
          pnpm db:types
          git diff --exit-code -- packages/core/src/database.types.ts
