version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      nuxt:
        patterns: ['nuxt', '@nuxt/*', '@nuxtjs/*']
      tooling:
        patterns: ['eslint*', '@nuxt/eslint*', 'typescript', 'vitest', '@vitest/*', '@playwright/test', 'vite', 'turbo']
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
