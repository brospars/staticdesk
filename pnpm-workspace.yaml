packages:
  - apps/*
  - packages/*
  - packages/integrations/*

onlyBuiltDependencies:
  - esbuild
  - vue-demi
  - '@parcel/watcher'
  - supabase

packageExtensions:
  # @nuxtjs/supabase imports h3 without declaring it, so pnpm resolves the
  # hoisted h3 v2, which breaks SSR on Nuxt 4 (nitropack 2 uses h3 v1).
  '@nuxtjs/supabase':
    dependencies:
      h3: ^1.15.0
